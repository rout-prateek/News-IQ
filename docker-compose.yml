version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: newsiq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: newsiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: newsiq_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
